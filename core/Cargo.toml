[package]
name = "streamable-rs"
version = "0.0.1"
edition = "2024"
description = "Unofficial Rust wrapper for the undocumented API of streamable.com"

[lints]
workspace = true

[lib]
name = "streamable"
path = "src/lib.rs"

[features]
DANGEROUSLY_SEND_REQUESTS_TO_REMOTE_SERVER = []

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["cookies", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-test = "0.4.5"
wiremock = "0.6.5"
