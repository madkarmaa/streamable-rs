[package]
name = "streamable-rs"
version = "0.0.1"
edition = "2024"
description = "Unofficial Rust wrapper for the undocumented API of streamable.com"

[lints]
workspace = true

[lib]
name = "streamable"
path = "src/lib.rs"

[features]
default = ["reqwest"]
DANGEROUSLY_SEND_REQUESTS_TO_REMOTE_SERVER = []
reqwest = ["dep:reqwest", "dep:tokio"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
cookie_store = "0.22.1"
file-format = { version = "0.29.0", features = ["reader"] }
hmac = "0.12"
http = "1.5.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["stream"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["fs"], optional = true }
url = "2.5.8"

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["full"] }
tokio-test = "0.4.5"
wiremock = "0.6.5"
